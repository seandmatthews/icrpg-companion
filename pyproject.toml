[project]
name = "table-companion"
version = "0.1.0"
description = "ICRPG table companion: LAN server + phone clients for hearts, timers, and loot at the table"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
